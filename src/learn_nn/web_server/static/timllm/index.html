<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Mini LLM Inference</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
  h1 { font-size: 20px; color: #333; }
  textarea { width: 100%; height: 80px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; resize: vertical; }
  button { margin-top: 10px; padding: 8px 20px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
  button:disabled { background: #ccc; cursor: not-allowed; }
  #result { margin-top: 20px; padding: 12px; background: #f5f5f5; border-radius: 4px; min-height: 40px; white-space: pre-wrap; font-size: 14px; }
</style>
</head>
<body>
  <h1>Tim-LLM 推理</h1>
  <textarea id="input" placeholder="输入文本..."></textarea>
  <button id="btn" onclick="infer()">推理</button>
  <div id="result">等待输入...</div>

  <script>
    async function infer() {
      const input = document.getElementById('input').value.trim();
      const resultEl = document.getElementById('result');
      const btn = document.getElementById('btn');
      if (!input) return;

      btn.disabled = true;
      resultEl.textContent = '推理中...';

      try {
        const resp = await fetch('/api/inference', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ input })
        });
        const data = await resp.json();
        resultEl.textContent = data.result ? data.result.join('\n') : JSON.stringify(data, null, 2);
      } catch (e) {
        resultEl.textContent = '请求失败: ' + e.message;
      } finally {
        btn.disabled = false;
      }
    }

    document.getElementById('input').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); infer(); }
    });
  </script>
</body>
</html>
