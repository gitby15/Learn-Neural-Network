<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <canvas id="canvas-1" width="280" height="280" style="border:1px solid #000000;"></canvas>
    <button id="button-1">下一张</button>
    <br>


    <script>
        const canvas = document.getElementById('canvas-1');
        const ctx = canvas.getContext('2d');
        const nextButton = document.getElementById('button-1');
        let index = 0;

        nextButton.addEventListener('click', async function (event) {
            const result = await fetch('/get_image', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ index: index++})
            })
            const data = await result.json();
            const image = data.image; // 784个元素的一维数组
            // 绘制到canvas上
            const imageData = ctx.createImageData(28, 28);
            for (let i = 0; i < image.length; i++) {
                const value = image[i];
                imageData.data[i * 4 + 0] = value; // R
                imageData.data[i * 4 + 1] = value; // G
                imageData.data[i * 4 + 2] = value; // B
                imageData.data[i * 4 + 3] = 255;   // A
            }
            // 放大绘制
            const offscreenCanvas = document.createElement('canvas');
            offscreenCanvas.width = 28;
            offscreenCanvas.height = 28;
            const offscreenCtx = offscreenCanvas.getContext('2d');
            offscreenCtx.putImageData(imageData, 0, 0);
            ctx.imageSmoothingEnabled = false; // 关闭抗锯齿
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(offscreenCanvas, 0, 0, canvas.width, canvas.height)


        });


    </script>
</body>

</html>
