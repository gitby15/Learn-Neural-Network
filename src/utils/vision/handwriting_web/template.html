<!DOCTYPE html>
<html lang="zh-cn">

<head>
    <meta charset="UTF-8">
    <title>手写板</title>
    <style>
        #canvas {
            border: 1px solid #333;
        }

        .btn {
            margin: 5px;
        }
    </style>
</head>

<body>
    <h2>手写板</h2>
    <canvas id="small-canvas" width="28" height="28" style="border:1px solid #333;"></canvas>
    <canvas id="canvas" width="280" height="280"></canvas><br>
    <button class="btn" onclick="clearCanvas()">清空</button>
    <button class="btn" onclick="saveCanvas()">保存</button>
    <p id="result"></p>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let drawing = false;
        ctx.lineWidth = 10;
        ctx.lineCap = 'round';
        ctx.strokeStyle = 'black';
        const smallCanvas = document.getElementById('small-canvas');
        const smallCtx = smallCanvas.getContext('2d');

        canvas.onmousedown = e => { drawing = true; ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY); document.getElementById('result').innerText = ""; };
        canvas.onmousemove = e => { if (drawing) { ctx.lineTo(e.offsetX, e.offsetY); ctx.stroke(); } };
        canvas.onmouseup = e => { drawing = false; };
        canvas.onmouseleave = e => { drawing = false; };
        canvas.ontouchstart = e => { e.preventDefault(); const rect = canvas.getBoundingClientRect(); const touch = e.touches[0]; const x = touch.clientX - rect.left; const y = touch.clientY - rect.top; drawing = true; ctx.beginPath(); ctx.moveTo(x, y); document.getElementById('result').innerText = ""; };
        canvas.ontouchmove = e => {
            e.preventDefault(); if (drawing) {
                const rect = canvas.getBoundingClientRect(); const touch = e.touches[0];
                const x = touch.clientX - rect.left;
                const y = touch.clientY - rect.top;
                ctx.lineTo(x, y); ctx.stroke();
            }
        };
        canvas.ontouchend = e => { e.preventDefault(); drawing = false; };



        window.aa = canvas;
        window.bb = ctx;
        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            smallCtx.clearRect(0, 0, smallCanvas.width, smallCanvas.height);
        }
        function saveCanvas() {
            // data现在是280*280，需要缩放到28*28

            smallCtx.drawImage(canvas, 0, 0, 28, 28);
            const { data: smallData } = smallCtx.getImageData(0, 0, 28, 28);

            const matrix = [];
            smallData.forEach((x, index) => {
                if (index % 4 === 3) { // alpha channel
                    matrix.push(x);
                }
            });
            console.log("matrix: ", matrix);
            fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ matrix })
            }).then(r => r.json()).then(d => {
                document.getElementById('result').innerText = "手写的结果是: " + d.result;
            });
        }

        console.log('version - 5')
    </script>
</body>

</html>
